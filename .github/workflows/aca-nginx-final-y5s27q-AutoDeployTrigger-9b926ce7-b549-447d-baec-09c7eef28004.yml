name: Trigger auto deployment for aca-nginx-final-y5s27q

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/aca-nginx-final-y5s27q-AutoDeployTrigger-9b926ce7-b549-447d-baec-09c7eef28004.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ACANGINXFINALY5S27Q_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ACANGINXFINALY5S27Q_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ACANGINXFINALY5S27Q_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.ACANGINXFINALY5S27Q_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACANGINXFINALY5S27Q_REGISTRY_PASSWORD }}
          containerAppName: aca-nginx-final-y5s27q
          resourceGroup: rg-aca-lab-Y5S27Q
          imageToBuild: rekaaa/aca-nginx-final-y5s27q:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


